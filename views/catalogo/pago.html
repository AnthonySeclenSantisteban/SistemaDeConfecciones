<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago — Confecciones Lix</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --azul: #1a3c5e; --azul-med: #2563a8; --azul-light: #e8f0fa;
            --accent: #c8622a; --verde: #059669; --rojo: #dc2626;
            --gris: #64748b; --gris-light: #f1f5f9; --border: #e2e8f0;
            --text: #1e293b; --radius: 14px;
            --font-display: 'Playfair Display', serif;
            --font-body: 'DM Sans', system-ui, sans-serif;
        }
        body {
            font-family: var(--font-body);
            background: var(--gris-light);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: var(--azul);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-brand { font-family: var(--font-display); color: #fff; font-size: 1.2rem; text-decoration: none; }
        .header-brand span { color: #93c5fd; }
        .header-back { color: rgba(255,255,255,.7); text-decoration: none; font-size: .85rem; }
        .header-back:hover { color: #fff; }
        .pasos-bar { background: #fff; border-bottom: 1px solid var(--border); padding: .8rem 1.5rem; }
        .pasos-inner { max-width: 540px; margin: 0 auto; display: flex; align-items: center; }
        .paso-item { display: flex; align-items: center; gap: .4rem; font-size: .82rem; font-weight: 600; color: var(--gris); flex: 1; justify-content: center; }
        .paso-item.active { color: var(--azul); }
        .paso-item.done { color: var(--verde); }
        .paso-num { width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 700; flex-shrink: 0; }
        .paso-item.active .paso-num { background: var(--azul); color: #fff; border-color: var(--azul); }
        .paso-item.done .paso-num { background: var(--verde); color: #fff; border-color: var(--verde); }
        .paso-sep { height: 1px; background: var(--border); flex: 0 0 24px; }
        .main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; gap: 1.5rem; flex-wrap: wrap; }
        .col-izq { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 1rem; }
        .col-der { width: 100%; max-width: 300px; }
        .card { background: #fff; border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 1.6rem; }
        .card-titulo { font-family: var(--font-display); font-size: 1.1rem; color: var(--azul); margin-bottom: 1.2rem; }
        .metodos-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: .6rem; margin-bottom: .5rem; }
        .metodo-btn { padding: .8rem .5rem; border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; text-align: center; background: #fff; font-family: var(--font-body); font-size: .82rem; font-weight: 500; transition: all .15s; }
        .metodo-btn:hover { border-color: var(--azul-med); background: var(--azul-light); }
        .metodo-btn.active { border-color: var(--azul); background: var(--azul-light); color: var(--azul); font-weight: 700; }
        .metodo-icono { display: block; font-size: 1.4rem; margin-bottom: .3rem; }
        .panel-pago { background: var(--gris-light); border-radius: var(--radius); padding: 1rem 1.2rem; margin-top: .8rem; font-size: .88rem; min-height: 60px; }
        .panel-numero { font-size: 1.3rem; font-weight: 800; color: var(--azul); font-family: monospace; letter-spacing: 1px; margin-bottom: .3rem; }
        .panel-titular { color: var(--gris); font-size: .82rem; }
        .field { display: flex; flex-direction: column; gap: .35rem; margin-top: 1rem; }
        .field label { font-size: .78rem; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .04em; }
        .field input, .field select { padding: .75rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; font-size: .93rem; font-family: var(--font-body); outline: none; transition: border-color .2s; color: var(--text); background: #fff; }
        .field input:focus, .field select:focus { border-color: var(--azul-med); }
        .radio-group { display: flex; gap: 1.2rem; margin-top: .5rem; }
        .radio-label { display: flex; align-items: center; gap: .4rem; font-size: .9rem; cursor: pointer; }
        .radio-label input { accent-color: var(--azul); }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; border-radius: 10px; padding: .8rem 1rem; font-size: .85rem; margin-bottom: 1rem; display: none; }
        .resumen-card { background: #fff; border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 1.6rem; position: sticky; top: 1rem; }
        .resumen-titulo { font-family: var(--font-display); font-size: 1rem; color: var(--azul); margin-bottom: 1rem; }
        .resumen-item { display: flex; justify-content: space-between; align-items: flex-start; padding: .5rem 0; border-bottom: 1px solid var(--border); font-size: .85rem; gap: .8rem; }
        .resumen-item:last-child { border-bottom: none; }
        .resumen-item-nombre { color: var(--text); line-height: 1.4; flex: 1; }
        .resumen-item-precio { font-weight: 700; color: var(--azul); white-space: nowrap; }
        .resumen-total { display: flex; justify-content: space-between; padding-top: .8rem; margin-top: .4rem; border-top: 2px solid var(--azul-light); font-weight: 700; font-size: 1.05rem; color: var(--azul); }
        .btns-row { display: flex; gap: .8rem; margin-top: 1.5rem; }
        .btn-back { padding: .75rem 1.2rem; background: var(--gris-light); color: var(--gris); border: 1px solid var(--border); border-radius: 10px; font-size: .9rem; cursor: pointer; font-family: var(--font-body); white-space: nowrap; }
        .btn-confirmar { flex: 1; padding: .85rem; background: var(--verde); color: #fff; border: none; border-radius: 10px; font-size: .95rem; font-weight: 700; cursor: pointer; font-family: var(--font-body); transition: background .2s; display: flex; align-items: center; justify-content: center; gap: .5rem; }
        .btn-confirmar:hover { background: #047857; }
        .btn-confirmar:disabled { background: #94a3b8; cursor: not-allowed; }
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .modal-confirm { background: #fff; border-radius: 20px; max-width: 440px; width: 100%; padding: 2.5rem; text-align: center; animation: slideUp .3s cubic-bezier(.16,1,.3,1); }
        @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:none; } }
        .confirm-icono { font-size: 4rem; margin-bottom: .8rem; }
        .modal-confirm h2 { font-family: var(--font-display); font-size: 1.5rem; color: var(--azul); margin-bottom: .5rem; }
        .confirm-sub { color: var(--gris); font-size: .9rem; margin-bottom: 1.5rem; }
        .confirm-datos { background: var(--gris-light); border-radius: var(--radius); padding: 1rem 1.2rem; text-align: left; margin-bottom: 1.5rem; }
        .conf-fila { display: flex; justify-content: space-between; font-size: .85rem; padding: .35rem 0; border-bottom: 1px solid var(--border); }
        .conf-fila:last-child { border-bottom: none; }
        .conf-fila strong { color: var(--azul); }
        .confirm-btns { display: flex; flex-direction: column; gap: .7rem; }
        .btn-wa { display: flex; align-items: center; justify-content: center; gap: .5rem; padding: .85rem; background: #25d366; color: #fff; border: none; border-radius: 10px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; font-family: var(--font-body); }
        .btn-wa:hover { background: #128c7e; }
        .btn-seguir { padding: .7rem; background: transparent; color: var(--gris); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: .88rem; font-family: var(--font-body); }
        .footer-min { text-align: center; padding: 1.5rem; font-size: .78rem; color: var(--gris); }
        @media (max-width: 600px) { .metodos-grid { grid-template-columns: repeat(2,1fr); } .col-der { max-width: 100%; } }
    </style>
</head>
<body>

<header class="header">
    <a href="/catalogo" class="header-brand">
    <span id="headerLogo">🧵</span> Confecciones <span>Lix</span>
    </a>
    <a href="/catalogo/mis-datos" class="header-back">← Atrás</a>
</header>

<div class="pasos-bar">
    <div class="pasos-inner">
        <div class="paso-item done">
            <div class="paso-num">✓</div>
            <span>Identificación</span>
        </div>
        <div class="paso-sep"></div>
        <div class="paso-item done">
            <div class="paso-num">✓</div>
            <span>Mis datos</span>
        </div>
        <div class="paso-sep"></div>
        <div class="paso-item active">
            <div class="paso-num">3</div>
            <span>Pago</span>
        </div>
    </div>
</div>

<main class="main">
    <div class="col-izq">
        <div class="card">
            <div class="card-titulo">Método de pago</div>
            <div class="metodos-grid" id="metodosGrid"></div>
            <div class="panel-pago" id="panelPago"></div>
            <div class="field" id="numOpWrap" style="display:none;">
                <label>N° de operación</label>
                <input type="text" id="inputNumOp" placeholder="Ej: 123456789"
                       oninput="this.value=this.value.replace(/\D/g,'')">
            </div>
        </div>

        <div class="card">
            <div class="card-titulo">Tipo de comprobante</div>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="tipoDoc" value="nota_venta" checked> Nota de venta
                </label>
                <label class="radio-label">
                    <input type="radio" name="tipoDoc" value="boleta"> Boleta
                </label>
            </div>
        </div>

        <div class="alert-error" id="alertError"></div>

        <div class="btns-row">
            <button class="btn-back" id="btnAtras">← Atrás</button>
            <button class="btn-confirmar" id="btnConfirmar">
                <div class="spinner" id="spinner"></div>
                <span id="btnTexto">Confirmar pedido</span>
            </button>
        </div>
    </div>

    <div class="col-der">
        <div class="resumen-card">
            <div class="resumen-titulo">Resumen del pedido</div>
            <div id="resumenItems"></div>
            <div class="resumen-total">
                <span>Total</span>
                <span id="resumenTotal">S/ 0.00</span>
            </div>
        </div>
    </div>
</main>

<div class="modal-overlay" id="modalConfirm">
    <div class="modal-confirm">
        <div class="confirm-icono">✅</div>
        <h2>¡Pedido registrado!</h2>
        <p class="confirm-sub">Gracias por tu compra. Nos comunicaremos contigo pronto.</p>
        <div class="confirm-datos" id="confirmDatos"></div>
        <div class="confirm-btns">
            <a id="btnWa" href="#" target="_blank" class="btn-wa">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.098.544 4.066 1.494 5.782L.057 23.25l5.619-1.474A11.946 11.946 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.808 9.808 0 01-4.998-1.368l-.358-.214-3.332.874.889-3.246-.234-.374A9.79 9.79 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
                Confirmar por WhatsApp
            </a>
            <button class="btn-seguir" id="btnSeguir">Seguir comprando</button>
        </div>
    </div>
</div>

<footer class="footer-min">© 2026 Confecciones Lix · Chiclayo, Perú</footer>

<script>
    const carrito  = JSON.parse(sessionStorage.getItem('lix_carrito') || '[]');
    const cliente  = JSON.parse(sessionStorage.getItem('lix_checkout_cliente') || 'null');
    const entrega  = JSON.parse(sessionStorage.getItem('lix_checkout_entrega') || 'null');
    let metodoActivo = '';
    let metodosPago  = [];

    document.addEventListener('DOMContentLoaded', async () => {
        fetch('/api/gestion-tienda/logo-publico')
    .then(r => r.json())
    .then(j => {
        if (j.ok && j.url) {
            const el = document.getElementById('headerLogo');
            if (el) el.innerHTML = `<img src="${j.url}" style="height:36px;width:auto;object-fit:contain;vertical-align:middle;">`;
        }
    }).catch(() => {});
        if (!carrito.length) { window.location.href = '/catalogo'; return; }
        if (!cliente)        { window.location.href = '/catalogo/identificacion'; return; }
        if (!entrega)        { window.location.href = '/catalogo/mis-datos'; return; }

        renderResumen();
        await cargarMetodos();

        document.getElementById('btnAtras').addEventListener('click', () => {
            window.location.href = '/catalogo/mis-datos';
        });

        document.getElementById('btnConfirmar').addEventListener('click', confirmar);
        document.getElementById('btnSeguir').addEventListener('click', () => {
            sessionStorage.removeItem('lix_carrito');
            sessionStorage.removeItem('lix_checkout_cliente');
            sessionStorage.removeItem('lix_checkout_entrega');
            window.location.href = '/catalogo';
        });
    });

    function renderResumen() {
        const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
        document.getElementById('resumenItems').innerHTML = carrito.map(i => `
            <div class="resumen-item">
                <div class="resumen-item-nombre">
                    ${i.nombre}
                    ${i.talla || i.color ? `<br><small style="color:var(--gris)">${[i.talla,i.color].filter(Boolean).join(' · ')}</small>` : ''}
                    <br><small style="color:var(--gris)">x${i.cantidad}</small>
                </div>
                <div class="resumen-item-precio">S/ ${(i.precio * i.cantidad).toFixed(2)}</div>
            </div>`).join('');
        document.getElementById('resumenTotal').textContent = `S/ ${total.toFixed(2)}`;
    }

    async function cargarMetodos() {
        try {
            const res  = await fetch('/api/metodos-pago-catalogo');
            const json = await res.json();
            if (!json.ok) return;
            metodosPago = json.data;
            renderMetodos();
        } catch (e) {
            renderMetodosFallback();
        }
    }

    function renderMetodos() {
        const iconos = { yape:'💜', plin:'💙', transferencia:'🏦', efectivo:'💵', visa:'💳' };
        const labels = { yape:'Yape', plin:'Plin', transferencia:'BCP', efectivo:'Efectivo', visa:'Visa' };
        const tipos  = metodosPago.length
            ? [...new Set(metodosPago.map(m => m.tipo))]
            : ['yape','plin','transferencia','efectivo'];

        document.getElementById('metodosGrid').innerHTML = tipos.map(t => `
            <button class="metodo-btn" data-metodo="${t}">
                <span class="metodo-icono">${iconos[t] || '💳'}</span>
                ${labels[t] || t}
            </button>`).join('');

        document.querySelectorAll('.metodo-btn').forEach(btn => {
            btn.addEventListener('click', () => seleccionarMetodo(btn.dataset.metodo));
        });

        if (tipos.length) seleccionarMetodo(tipos[0]);
    }

    function renderMetodosFallback() {
        metodosPago = [];
        renderMetodos();
    }

    function seleccionarMetodo(tipo) {
        metodoActivo = tipo;
        document.querySelectorAll('.metodo-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.metodo === tipo);
        });
        renderPanelPago(tipo);
    }

    function renderPanelPago(tipo) {
        const total   = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0).toFixed(2);
        const metodo  = metodosPago.find(m => m.tipo === tipo);
        const panel   = document.getElementById('panelPago');
        const numWrap = document.getElementById('numOpWrap');

        if (tipo === 'yape' || tipo === 'plin') {
            const num  = metodo?.numero_telefono || '945 952 450';
            const nom  = metodo?.nombre_titular  || 'Confecciones Lix';
            panel.innerHTML = `
                <div style="display:flex;align-items:center;gap:1rem;">
                    <div style="font-size:2.5rem;">${tipo === 'yape' ? '💜' : '💙'}</div>
                    <div>
                        <div class="panel-numero">${num}</div>
                        <div class="panel-titular">${nom}</div>
                        <div style="font-size:.82rem;color:var(--gris);margin-top:.3rem;">Monto: <strong style="color:var(--azul);">S/ ${total}</strong></div>
                    </div>
                </div>
                <div style="background:#fff8e1;border-radius:8px;padding:.6rem .8rem;margin-top:.8rem;font-size:.8rem;color:#92400e;">
                    📸 Envíanos el comprobante por WhatsApp después de pagar
                </div>`;
            numWrap.style.display = 'block';
        } else if (tipo === 'transferencia') {
            const cta = metodo?.numero_cuenta || '305-98113774-0-08';
            const nom = metodo?.nombre_titular || 'Confecciones Lix';
            panel.innerHTML = `
                <div style="display:flex;align-items:center;gap:1rem;">
                    <div style="font-size:2.5rem;">🏦</div>
                    <div>
                        <div style="font-size:.75rem;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;">Banco BCP</div>
                        <div class="panel-numero">${cta}</div>
                        <div class="panel-titular">${nom}</div>
                        <div style="font-size:.82rem;color:var(--gris);margin-top:.3rem;">Monto: <strong style="color:var(--azul);">S/ ${total}</strong></div>
                    </div>
                </div>`;
            numWrap.style.display = 'block';
        } else if (tipo === 'efectivo') {
            panel.innerHTML = `
                <div style="display:flex;align-items:center;gap:1rem;">
                    <div style="font-size:2.5rem;">💵</div>
                    <div>
                        <div style="font-weight:700;color:var(--text);">Pago contra entrega</div>
                        <div style="font-size:.85rem;color:var(--gris);margin-top:.3rem;">Paga al recoger o recibir tu pedido</div>
                        <div style="font-size:.82rem;margin-top:.3rem;">Total: <strong style="color:var(--azul);">S/ ${total}</strong></div>
                    </div>
                </div>`;
            numWrap.style.display = 'none';
        } else {
            panel.innerHTML = `<div style="color:var(--gris);font-size:.88rem;">Selecciona un método de pago</div>`;
            numWrap.style.display = 'none';
        }
    }

    async function confirmar() {
        const alertEl  = document.getElementById('alertError');
        const tipoDoc  = document.querySelector('input[name="tipoDoc"]:checked').value;
        const numOp    = document.getElementById('inputNumOp').value.trim();
        alertEl.style.display = 'none';

        if (!metodoActivo) { mostrarError('Selecciona un método de pago'); return; }

        const btn     = document.getElementById('btnConfirmar');
        const spinner = document.getElementById('spinner');
        const txtBtn  = document.getElementById('btnTexto');
        btn.disabled = true;
        spinner.style.display = 'block';
        txtBtn.textContent = 'Procesando...';

        try {
            const res  = await fetch('/api/checkout/confirmar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    metodo_pago: metodoActivo,
                    numero_operacion: numOp || null,
                    tipo_documento: tipoDoc,
                    carrito: carrito
                })
            });
            const json = await res.json();

            if (json.ok) {
                mostrarConfirmacion(json);
            } else {
                mostrarError(json.mensaje);
            }
        } catch (e) {
            mostrarError('Error de conexión. Intenta nuevamente.');
        } finally {
            btn.disabled = false;
            spinner.style.display = 'none';
            txtBtn.textContent = 'Confirmar pedido';
        }
    }

    function mostrarConfirmacion(data) {
        const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0).toFixed(2);
        document.getElementById('confirmDatos').innerHTML = `
            <div class="conf-fila"><span>Cliente</span><strong>${cliente.nombres} ${cliente.apellidos || ''}</strong></div>
            <div class="conf-fila"><span>N° Venta</span><strong>${data.numero_venta}</strong></div>
            <div class="conf-fila"><span>Código seguimiento</span><strong>${data.codigo_seguimiento}</strong></div>
            <div class="conf-fila"><span>Total</span><strong>S/ ${total}</strong></div>
            <div class="conf-fila"><span>Entrega</span><strong>${entrega.tipo_entrega === 'delivery' ? '🚗 Delivery' : '🏪 Recojo en tienda'}</strong></div>`;

        const msg = encodeURIComponent(`Hola! Acabo de realizar mi pedido en Confecciones Lix.\n*N° Venta:* ${data.numero_venta}\n*Código:* ${data.codigo_seguimiento}\n*Total:* S/ ${total}`);
        document.getElementById('btnWa').href = `https://wa.me/51945952450?text=${msg}`;
        document.getElementById('modalConfirm').classList.add('active');
    }

    function mostrarError(msg) {
        const el = document.getElementById('alertError');
        el.textContent = msg;
        el.style.display = 'block';
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
</script>
</body>
</html>
