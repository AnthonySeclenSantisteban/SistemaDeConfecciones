<div class="modulo-header">
  <div>
    <h2 class="modulo-titulo">Colegios</h2>
    <p class="modulo-subtitulo">Administra los colegios del catálogo</p>
  </div>
  <button class="btn-primary" id="btn-nuevo-colegio">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Nuevo colegio
  </button>
</div>

<div class="content-card">
  <div class="content-card-header">
    <span class="content-card-title">Lista de colegios</span>
    <span class="total-label" id="total-colegios"></span>
  </div>

  <div style="display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;">
    <div class="input-wrap" style="flex:1;min-width:180px;">
      <span class="input-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="col-filtro-nombre" placeholder="Buscar por nombre…">
    </div>
    <div class="input-wrap" style="min-width:150px;">
      <select id="col-filtro-estado">
        <option value="">Todos los estados</option>
        <option value="1">Activo</option>
        <option value="0">Inactivo</option>
      </select>
    </div>
    <button class="btn-secondary" id="col-btn-limpiar" style="padding:7px 14px;font-size:13px;">✕ Limpiar</button>
  </div>

  <div id="colegios-loading" class="spinner-wrap"><div class="spinner"></div></div>
  <div id="colegios-empty" class="empty-state" style="display:none;">
    <p>No hay colegios registrados</p>
  </div>
  <div id="colegios-tabla" style="display:none;overflow-x:auto;">
    <table class="tabla">
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Distrito</th>
          <th>Provincia</th>
          <th>Estado</th>
          <th style="text-align:right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="colegios-tbody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modal-colegio" style="display:none;">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <span class="modal-title" id="modal-colegio-titulo">Nuevo colegio</span>
    </div>
    <div class="alert alert-error" id="modal-colegio-alert" style="display:none;">
      <span id="modal-colegio-alert-msg"></span>
    </div>
    <input type="hidden" id="colegio-id">
    <div class="field">
      <label>Nombre del colegio <span style="color:#dc2626;">*</span></label>
      <div class="input-wrap">
        <input type="text" id="colegio-nombre" placeholder="Ej. San José">
      </div>
    </div>
    <div class="field">
      <label>Distrito</label>
      <div class="input-wrap">
        <input type="text" id="colegio-distrito" placeholder="Chiclayo">
      </div>
    </div>
    <div class="field">
      <label>Provincia</label>
      <div class="input-wrap">
        <input type="text" id="colegio-provincia" placeholder="Chiclayo">
      </div>
    </div>
    <div class="field">
      <label>Estado</label>
      <div class="input-wrap">
        <select id="colegio-estado">
          <option value="1">Activo</option>
          <option value="0">Inactivo</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="btn-cancelar-modal-colegio">Cancelar</button>
      <button class="btn-primary" id="btn-guardar-colegio">
        <span id="btn-guardar-colegio-text">Crear colegio</span>
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-eliminar-colegio" style="display:none;">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title">¿Eliminar colegio?</span>
    </div>
    <p class="modal-desc">El colegio <strong id="eliminar-colegio-nombre"></strong> será desactivado y no aparecerá en el sistema.</p>
    <div class="modal-footer">
      <button class="btn-secondary" id="btn-cancelar-eliminar-colegio">Cancelar</button>
      <button class="btn-danger" id="btn-confirmar-eliminar-colegio">Sí, eliminar</button>
    </div>
  </div>
</div>

<style>
  #modal-colegio.modal-overlay,
  #modal-eliminar-colegio.modal-overlay {
    align-items: center !important;
    padding-top: 0 !important;
    overflow-y: auto;
  }
  #modal-colegio .modal,
  #modal-eliminar-colegio .modal {
    margin: auto;
  }
</style>
