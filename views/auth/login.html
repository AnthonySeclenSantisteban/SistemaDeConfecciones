<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Iniciar Sesion</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='/css/login.css'>
</head>
<body>
     <div class="fondo"></div>
 
  <div class="card">
    <div class="logo-area">
      <img class="logo-img" id="logo-img" src="" alt="Logo" style="display:none;">

      <div class="logo-name" style="font-family:'Sora',sans-serif;font-size:1.6rem;font-weight:700;color:#1a3c5e;margin-top:.4rem;">
        Confecciones <span style="color:#c8622a;">Lix</span>
      </div>
      <div class="tagline">Sistema de gestión</div>
    </div>
 
    <div class="divider"></div>
 
    <div class="titulo">
      <h1>Iniciar sesión</h1>
      <p>Ingresa tus credenciales para continuar</p>
    </div>
 
    <div class="error-msg" id="error-msg">
      <span class="ico">⚠️</span>
      <span id="error-text">Correo o contraseña incorrectos.</span>
    </div>
 
    <form action="/login" method="POST" id="loginForm">
      <div class="field">
        <label for="correo">Correo electrónico</label>
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input
            type="email"
            id="correo"
            name="correo"
            placeholder="admin@ejemplo.com"
            autocomplete="email"
            required
          >
        </div>
      </div>
 
      <div class="field">
        <label for="contra">Contraseña</label>
        <div class="input-wrap">
          <input
            type="password"
            id="contra"
            name="contra"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <button type="button" class="toggle-pass" id="togglePass" title="Mostrar/ocultar">👁</button>
        </div>
      </div>
 
      <button type="submit" class="btn" id="btnLogin">
        <div class="spinner"></div>
        <span class="btn-text">Entrar →</span>
      </button>
    </form>
 
    <div class="final"> 2026 - Confecciones Lix </div>
  </div>

   <script>
   
    fetch('/api/gestion-tienda/logo-publico')
      .then(r => r.json())
      .then(j => {
        if (j.ok && j.url) {
          const img = document.getElementById('logo-img');
          img.src = j.url;
          img.style.display = 'block';
          img.style.width = '64px';
          img.style.height = '64px';
          img.style.borderRadius = '14px';
          img.style.objectFit = 'cover';
          img.style.margin = '0 auto';
        }
      }).catch(() => {});

    const params = new URLSearchParams(window.location.search);
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
 
    if (params.get('error') === '1') {
    errorMsg.classList.add('show');
    errorText.textContent = 'Correo o contraseña incorrectos.';
    } else if (params.get('error') === '2') {
        errorMsg.classList.add('show');
        errorText.textContent = 'Error del servidor, intenta de nuevo.';
    } else if (params.get('error') === '3') {
        errorMsg.classList.add('show');
        errorText.textContent = 'Tu cuenta está inhabilitada :C. Contacta al administrador.';
    } else if (params.get('error') === '4') {
        errorMsg.classList.add('show');
        errorText.textContent = 'Tu perfil está inhabilitado :C . No puedes acceder al sistema.';
    }
 
    document.getElementById('togglePass').addEventListener('click', function () {
      const input = document.getElementById('contra');
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      this.textContent = isPass ? ' ' : '👁';
    });
 
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      const correo = document.getElementById('correo').value.trim();
      const contra = document.getElementById('contra').value;

      if (!correo) {
        e.preventDefault();
        mostrarErrorLocal('Ingresa tu correo electrónico.');
        return;
      }
      if (!correo.includes('@')) {
        e.preventDefault();
        mostrarErrorLocal('El correo debe contener el símbolo @ (ejemplo: usuario@gmail.com).');
        return;
      }
      const partes = correo.split('@');
      if (partes.length !== 2 || !partes[1].includes('.')) {
        e.preventDefault();
        mostrarErrorLocal('El correo no tiene un formato válido (ejemplo: usuario@gmail.com).');
        return;
      }
      if (!contra) {
        e.preventDefault();
        mostrarErrorLocal('Ingresa tu contraseña.');
        return;
      }

      const btn = document.getElementById('btnLogin');
      btn.classList.add('loading');
      btn.disabled = true;
    });

    function mostrarErrorLocal(msg) {
      errorMsg.classList.add('show');
      errorText.textContent = msg;
    }
  </script>

</body>
</html>
